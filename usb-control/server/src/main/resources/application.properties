# 관리 화면 주소: http://이PC주소:8080
server.port=8080

# 데이터는 서버를 실행한 폴더 아래 data 폴더에 저장됩니다. 이 폴더를 정기적으로 백업하세요.
spring.datasource.url=jdbc:h2:file:./data/usbcontrol
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.h2.console.enabled=false

# 관리 화면을 30분 동안 안 쓰면 자동 로그아웃
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

spring.thymeleaf.cache=true
logging.file.name=./logs/server.log

# 자동 백업 (매일 02:30, 최근 60개 보관)
usbcontrol.backup.dir=./backup
usbcontrol.backup.keep=60
usbcontrol.backup.cron=0 30 2 * * *
