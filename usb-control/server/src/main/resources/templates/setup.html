<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('처음 설정')}"></head>
<body>
<div class="login">
    <h1>첫 관리자 계정 만들기</h1>
    <p class="hint">처음 한 번만 나오는 화면입니다. 관리자는 사람마다 따로 만들어 쓰세요. (공용 계정 금지)</p>
    <div class="msg bad" th:if="${error}" th:text="${error}"></div>
    <div class="card">
        <form th:action="@{/setup}" method="post">
            <div class="field"><label for="username">아이디</label>
                <input type="text" id="username" name="username" th:value="${username}" autofocus></div>
            <div class="field"><label for="password">비밀번호</label>
                <input type="password" id="password" name="password" autocomplete="new-password">
                <div class="hint">영문 대문자/소문자/숫자/특수문자 중 3종류 이상 8자 이상, 또는 2종류 이상 10자 이상</div></div>
            <div class="field"><label for="passwordConfirm">비밀번호 확인</label>
                <input type="password" id="passwordConfirm" name="passwordConfirm" autocomplete="new-password"></div>
            <button type="submit" style="width:100%">만들기</button>
        </form>
    </div>
</div>
</body>
</html>
