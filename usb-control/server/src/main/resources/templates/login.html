<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('로그인')}"></head>
<body>
<div class="login">
    <h1>USB 매체제어 관리</h1>
    <div class="msg bad" th:if="${param.error != null and param.error[0] == 'locked'}">
        비밀번호를 5번 틀려 10분 동안 잠겼습니다. 잠시 뒤에 다시 시도하세요.
    </div>
    <div class="msg bad" th:if="${param.error != null and param.error[0] != 'locked'}">아이디 또는 비밀번호가 틀립니다.</div>
    <div class="msg ok" th:if="${param.logout}">로그아웃했습니다.</div>
    <div class="msg ok" th:if="${param.created}">관리자 계정을 만들었습니다. 로그인하세요.</div>
    <div class="card">
        <form th:action="@{/login}" method="post">
            <div class="field"><label for="username">아이디</label>
                <input type="text" id="username" name="username" autofocus autocomplete="username"></div>
            <div class="field"><label for="password">비밀번호</label>
                <input type="password" id="password" name="password" autocomplete="current-password"></div>
            <button type="submit" style="width:100%">로그인</button>
        </form>
    </div>
</div>
</body>
</html>
