<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('관리 이력')}"></head>
<body>
<div th:replace="~{fragments :: top('audit')}"></div>
<main>
    <h1>관리 이력</h1>
    <p class="hint">관리자의 로그인과 모든 변경 작업이 남습니다. 화면에서는 고치거나 지울 수 없습니다. (최근 1000건 표시)</p>
    <div class="toolbar"><a class="btn sub" th:href="@{/audit/export}">엑셀 내려받기</a></div>
    <div class="table-wrap">
        <table>
            <tr><th>시간</th><th>관리자</th><th>접속 IP</th><th>작업</th><th>내용</th></tr>
            <tr th:each="l : ${logs}">
                <td th:text="${#temporals.format(l.at, 'yyyy-MM-dd HH:mm:ss')}" style="white-space:nowrap"></td>
                <td th:text="${l.adminName}"></td>
                <td th:text="${l.ipAddress}"></td>
                <td th:text="${l.action}" style="white-space:nowrap"></td>
                <td th:text="${l.detail}"></td>
            </tr>
        </table>
    </div>
</main>
</body>
</html>
